<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>まいにちドリル</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fffaf0;
        color: #1f2937;
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;

        padding: 24px;
      }
      button {

        border: 0;

        font-size: 20px;
        font-weight: bold;
      }

  <body>
    <div style="font-size: 64px">📶</div>
    <p style="font-size: 20px; font-weight: bold">インターネットに つながっていません</p>
    <p>つながったら もういちど ためしてね</p>
    <button onclick="location.reload()">もういちど</button>

</html>
