# GitHub Pages への自動デプロイ
# このブランチにプッシュするたびにビルドして、gh-pages ブランチへ発行する。
# (GitHub Pages は gh-pages ブランチを配信する設定になっている)
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/repository-selection-m2lzqe]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: '公開ビルドを更新'
