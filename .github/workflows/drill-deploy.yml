# まいにちドリル（drill/）を Cloudflare Workers にデプロイする
# リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録すると動く。
# 登録前はデプロイの手順をとばす（失敗にはしない）。
# LINE 通知を使うときは LINE_CHANNEL_ACCESS_TOKEN・LINE_CHANNEL_SECRET・LINE_BOT_ID も登録する。
name: Deploy まいにちドリル (Cloudflare)

on:
  push:
    branches: [claude/new-session-y57tao]
    paths:
      - "drill/**"
      - ".github/workflows/drill-deploy.yml"
  workflow_dispatch:

concurrency:
  group: drill-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drill
        # pipefail を有効にする（デプロイの失敗を tee で見のがさないため）
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drill/package-lock.json

      - name: Secrets の確認
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID がリポジトリの Secrets に登録されていないため、デプロイをとばします"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: テスト
        run: npm test

      - name: D1 データベースの準備（なければ作成）
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/ci-ensure-d1.cjs

      - name: マイグレーション（本番の D1）
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: データの概要（件数のみ。名前やメールは出さない）
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx wrangler d1 execute DB --remote --json --command "SELECT substr(f.created_at,1,10) AS created, (SELECT COUNT(*) FROM parents p WHERE p.family_id=f.id) AS parents, (SELECT COUNT(*) FROM children c WHERE c.family_id=f.id) AS children, (SELECT COUNT(*) FROM devices d JOIN children c ON c.id=d.child_id WHERE c.family_id=f.id AND d.revoked_at IS NULL) AS devices, (SELECT COUNT(*) FROM sessions s JOIN children c ON c.id=s.child_id WHERE c.family_id=f.id AND s.study_date >= date('now','-3 day')) AS recent_sessions FROM families f ORDER BY f.created_at" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d)[0].results;console.log("家族アカウントの数:",r.length);r.forEach((x,i)=>console.log(`家族${i+1}: 作成 ${x.created} / 親 ${x.parents}人 / 子ども ${x.children}人 / 登録中の端末 ${x.devices}台 / 直近3日の学習 ${x.recent_sessions}件`))})'

      - name: ビルドとデプロイ
        if: steps.secrets.outputs.ready == 'true'
        run: npm run deploy 2>&1 | tee deploy.log

      - name: Worker の secret（毎時の Cron の合言葉・LINE）
        if: steps.secrets.outputs.ready == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_BOT_ID: ${{ secrets.LINE_BOT_ID }}
        run: node scripts/ci-put-secrets.cjs

      - name: 動作確認（デプロイしたページが開けるか）
        if: steps.secrets.outputs.ready == 'true'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | tail -1)
          if [ -z "$URL" ]; then echo "::error::デプロイ先の URL が見つかりません"; exit 1; fi
          echo "デプロイ先: $URL"
          echo "### デプロイ先: $URL" >> "$GITHUB_STEP_SUMMARY"
          for path in /welcome /parent/login /pair /manifest.webmanifest /sw.js /icons/icon-192.png; do
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$path") && [ "$code" = "200" ] && break
              sleep 5
            done
            echo "$path -> $code"
            if [ "$code" != "200" ]; then echo "::error::$path が $code を返しました"; exit 1; fi
          done
          # 未ログインで親の画面を開くと、ログイン画面に回されること
          curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" "$URL/parent" | tee r.txt
          grep -q "/parent/login" r.txt || { echo "::error::/parent がログイン画面に回されません"; exit 1; }
