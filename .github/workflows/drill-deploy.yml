# まいにちドリル（drill/）を Cloudflare Workers にデプロイする
# リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録すると動く。
# 登録前はデプロイの手順をとばす（失敗にはしない）。
name: Deploy まいにちドリル (Cloudflare)

on:
  push:
    branches: [claude/new-session-y57tao]
    paths:
      - "drill/**"
      - ".github/workflows/drill-deploy.yml"
  workflow_dispatch:

concurrency:
  group: drill-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drill
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drill/package-lock.json

      - name: Secrets の確認
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID がリポジトリの Secrets に登録されていないため、デプロイをとばします"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: テスト
        run: npm test

      - name: D1 データベースの準備（なければ作成）
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/ci-ensure-d1.cjs

      - name: マイグレーション（本番の D1）
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: ビルドとデプロイ
        if: steps.secrets.outputs.ready == 'true'
        run: npm run deploy 2>&1 | tee deploy.log

      - name: 動作確認（デプロイしたページが開けるか）
        if: steps.secrets.outputs.ready == 'true'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | tail -1)
          if [ -z "$URL" ]; then echo "::error::デプロイ先の URL が見つかりません"; exit 1; fi
          echo "デプロイ先: $URL"
          echo "### デプロイ先: $URL" >> "$GITHUB_STEP_SUMMARY"
          for path in /welcome /parent/login /pair /manifest.webmanifest /sw.js /icons/icon-192.png; do
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$path") && [ "$code" = "200" ] && break
              sleep 5
            done
            echo "$path -> $code"
            if [ "$code" != "200" ]; then echo "::error::$path が $code を返しました"; exit 1; fi
          done
          # 未ログインで親の画面を開くと、ログイン画面に回されること
          curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" "$URL/parent" | tee r.txt
          grep -q "/parent/login" r.txt || { echo "::error::/parent がログイン画面に回されません"; exit 1; }
