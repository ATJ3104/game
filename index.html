<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="ブロックロボで戦う2D対戦格闘ゲーム" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  <title>ロボファイター</title>
  <style>
    /* 画面いっぱいの黒背景にキャンバスを中央配置する */
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0b14;
      height: 100%;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      touch-action: none; /* スマホでスクロールやピンチが暴発しないように */
      background: #000;
    }
    /* スマホをたて持ちしたときに出す「よこもちにしてね」の案内 */
    #rotate {
      position: fixed;
      inset: 0;
      background: #0b0b14;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: sans-serif;
      font-size: 22px;
      z-index: 10;
      text-align: center;
    }
    #rotate .icon { font-size: 56px; margin-bottom: 16px; animation: spin 1.6s ease-in-out infinite; }
    @keyframes spin {
      0%, 40% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(90deg); }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-4E7yN_Jw.js"></script>
</head>
<body>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <div id="rotate"><div class="icon">📱</div><div>スマホを よこもちにしてね!</div></div>
</body>
</html>
